[project]
name = "agentpal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mahmoud", email = "star7ana@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.156.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
agentpal = "agentpal:main"
agentpal-bootstrap = "agentpal.auth.bootstrap:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]
